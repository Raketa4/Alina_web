<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Серии — Алина Хоняк</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://raketa4.github.io/Alina_web/series.html">
  <!-- Отдельных страниц серий больше нет: серии — ленты на series.html.
       Старые ссылки series-view.html?slug=… ведут к ленте нужной серии. -->
  <script>
    const slug = new URLSearchParams(location.search).get('slug');
    location.replace('series.html' + location.search.replace(/[?&]?slug=[^&]*/, '').replace(/^&/, '?')
      + (slug ? '#' + encodeURIComponent(slug) : ''));
  </script>
  <meta http-equiv="refresh" content="0; url=series.html">
</head>
<body></body>
</html>
