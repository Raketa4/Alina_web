<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RUNNING</title>
<!-- Браузерные проверки: страница сайта грузится во фрейм нужного размера,
     результат пишется в <title> как "PASS …" или "FAIL …".
     Запуск: python scripts/browser_check.py -->
<style>body { margin: 0; } iframe { border: 0; display: block; }</style>
</head>
<body>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search);
const frame = document.getElementById('f');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const done = (ok, msg) => { document.title = `${ok ? 'PASS' : 'FAIL'} ${msg}`; };

function load(src, w = 1440, h = 900) {
  frame.width = w;
  frame.height = h;
  return new Promise((resolve) => {
    frame.onload = async () => { await wait(1500); resolve(frame.contentWindow); };
    frame.src = src;
  });
}

const cases = {
  // Клик по самому изображению не закрывает просмотрщик (браузер с pointer
  // capture доставляет click на .viewer-stage — эмулируем именно это).
  async 'viewer-click-image'() {
    const win = await load('../series-view.html?slug=mountains-and-sea');
    const d = win.document;
    d.querySelector('[data-zoom]').click();
    await wait(300);
    const stage = d.querySelector('.viewer-stage');
    const img = d.querySelector('.viewer-img');
    const opts = { bubbles: true, cancelable: true, pointerId: 1, clientX: 10, clientY: 10 };
    img.dispatchEvent(new win.PointerEvent('pointerdown', opts));
    stage.dispatchEvent(new win.PointerEvent('pointerup', opts));
    stage.dispatchEvent(new win.MouseEvent('click', { bubbles: true }));
    const open = !d.querySelector('.viewer').hidden;
    // а клик по пустому полю по-прежнему закрывает
    stage.dispatchEvent(new win.PointerEvent('pointerdown', opts));
    stage.dispatchEvent(new win.PointerEvent('pointerup', opts));
    stage.dispatchEvent(new win.MouseEvent('click', { bubbles: true }));
    const closed = d.querySelector('.viewer').hidden;
    return [open && closed, `image-click keeps open=${open}, backdrop-click closes=${closed}`];
  },

  // Меню при размере w×h — как у liars.co: белый фон, 8 прямоугольников
  // 2 × 4 с пропорцией 1,3 : 1, разделённых чёрными линиями; в каждом только
  // надпись, строго по центру, не обрезана. Сетка сразу под шапкой, по центру,
  // целиком на экране и упирается либо в края экрана, либо почти в низ
  // (тогда вокруг неё рамка). С edge=1 — обязательно от края до края.
  async 'menu-fit'() {
    const w = +q.get('w');
    const h = +q.get('h');
    const win = await load('../index.html', w, h);
    const d = win.document;
    d.querySelector('.menu-toggle').click();
    await wait(1200);
    d.getAnimations().forEach((a) => a.finish()); // проверяем итог, а не ход анимации
    const bad = [];
    if (!d.body.classList.contains('menu-open')) bad.push('not-open');
    const dark = (s) => parseFloat(s.width) >= 1
      && (s.color.match(/\d+/g) || []).slice(0, 3).every((v) => +v < 40);
    const line = (cs, side) => ({ width: cs[`border${side}Width`], color: cs[`border${side}Color`] });

    const ls = win.getComputedStyle(d.querySelector('.menu-layer'));
    if (ls.backgroundImage !== 'none' || ls.backgroundColor !== 'rgb(255, 255, 255)') bad.push('bg-not-white');

    const cells = [...d.querySelectorAll('.menu-cell')];
    const rects = cells.map((c) => c.getBoundingClientRect());
    const cols = new Set(rects.map((r) => Math.round(r.left))).size;
    const rows = new Set(rects.map((r) => Math.round(r.top))).size;
    if (cells.length !== 8 || cols !== 2 || rows !== 4) bad.push(`grid=${cells.length}:${cols}x${rows}`);

    cells.forEach((c, i) => {
      const r = rects[i];
      const id = c.dataset.id;
      const ratio = r.width / r.height;
      if (Math.abs(ratio - 1.3) > 0.03) bad.push(`${id}:ratio=${ratio.toFixed(2)}`);
      if (id !== 'shop' && !c.matches('a[href]')) bad.push(`${id}:not-link`);
      if (c.children.length !== 1) bad.push(`${id}:children=${c.children.length}`);
      const title = c.firstElementChild;
      const t = title.getBoundingClientRect();
      const dx = (t.left + t.right - r.left - r.right) / 2;
      const dy = (t.top + t.bottom - r.top - r.bottom) / 2;
      if (Math.abs(dx) > 1.5 || Math.abs(dy) > 1.5) bad.push(`${id}:offcenter=${dx.toFixed(1)},${dy.toFixed(1)}`);
      if (parseFloat(win.getComputedStyle(title).fontSize) < 11) bad.push(`${id}:tiny-font`);
      if (!dark(line(win.getComputedStyle(c), 'Bottom'))) bad.push(`${id}:no-line`);
      if (c.scrollHeight > c.clientHeight + 1) bad.push(`${id}:overflow+${c.scrollHeight - c.clientHeight}`);
      if (c.scrollWidth > c.clientWidth + 1) bad.push(`${id}:wide+${c.scrollWidth - c.clientWidth}`);
    });

    if (rects.length) {
      const L = Math.min(...rects.map((r) => r.left));
      const R = Math.max(...rects.map((r) => r.right));
      const T = Math.min(...rects.map((r) => r.top));
      const B = Math.max(...rects.map((r) => r.bottom));
      const headerBottom = d.querySelector('.site-header').getBoundingClientRect().bottom;
      if (L < -1 || R > w + 1) bad.push('offscreen-x');
      if (B > h + 1) bad.push('below-fold');
      if (Math.abs(T - headerBottom) > 2) bad.push(`top=${Math.round(T)}`);
      if (Math.abs(L - (w - R)) > 1.5) bad.push(`not-centered=${L.toFixed(1)}|${(w - R).toFixed(1)}`);
      const framed = L > 1.5;
      if (framed && B < h - 40) bad.push('too-small');
      if (q.get('edge') && framed) bad.push(`not-edge-to-edge=${L.toFixed(1)}`);
      const gs = win.getComputedStyle(d.querySelector('.menu-grid'));
      if (!dark(line(gs, 'Top'))) bad.push('no-top-line');
      if (framed && !dark(line(gs, 'Left'))) bad.push('no-frame');
    }
    return [!bad.length, `${w}x${h} ${bad.join(' ') || 'ok'}`];
  },

  // Контакты: вверху блок «Связь с художником» (на телефоне по центру) с почтой,
  // Telegram и формой обратной связи под фразой; блока мастерской здесь нет.
  async 'contacts-layout'() {
    const w = +q.get('w');
    const h = +q.get('h');
    const win = await load('../contacts.html', w, h);
    const d = win.document;
    const bad = [];
    const intro = d.querySelector('.contacts-intro');
    if (!intro) return [false, `${w}x${h} missing-intro`];
    if (d.querySelector('.studio-visit, .contacts-studio')) bad.push('studio-still-here');
    const cw = d.documentElement.clientWidth; // без полосы прокрутки
    const centered = win.getComputedStyle(intro).textAlign === 'center';
    if (w >= 740 && centered) bad.push('intro-centered');
    if (w < 740 && !centered) bad.push('intro-not-centered');
    const tg = 'https://t.me/alinakhoniakart';
    if (!intro.querySelector('a[href="mailto:alinakhoniak@gmail.com"]')) bad.push('no-mail');
    if (!intro.querySelector(`a[href="${tg}"]`)) bad.push('no-telegram');
    // форма обратной связи — в блоке связи, под фразой с почтой
    const form = intro.querySelector('form#contact-form');
    const phrase = intro.querySelector('.contacts-muted');
    if (!form) bad.push('no-form');
    else {
      const lead = intro.querySelector('.contacts-form-intro');
      if (!lead) bad.push('no-form-intro');
      else if (lead.getBoundingClientRect().top < phrase.getBoundingClientRect().bottom
        || form.getBoundingClientRect().top < lead.getBoundingClientRect().bottom) bad.push('form-intro-order');
      else if (lead.getBoundingClientRect().top - phrase.getBoundingClientRect().bottom < 28) {
        bad.push(`form-intro-gap=${Math.round(lead.getBoundingClientRect().top - phrase.getBoundingClientRect().bottom)}`);
      }
      ['name', 'email', 'message', 'consent'].forEach((n) => {
        if (!form.querySelector(`[name="${n}"][required]`)) bad.push(`field-${n}`);
      });
      if (!form.querySelector('a[href="info.html#consent"]')) bad.push('no-consent-link');
      const f = form.getBoundingClientRect();
      if (f.left < -1 || f.right > cw + 1) bad.push('form-offscreen');
    }
    // блок стоит в общей колонке сайта (.container), как содержимое других страниц
    const probe = d.createElement('div');
    probe.className = 'container';
    d.body.append(probe);
    const colLeft = probe.getBoundingClientRect().left + parseFloat(win.getComputedStyle(probe).paddingLeft);
    const colRight = probe.getBoundingClientRect().right - parseFloat(win.getComputedStyle(probe).paddingRight);
    probe.remove();
    const head = intro.querySelector('.contacts-heading').getBoundingClientRect();
    if (w >= 740 && Math.abs(head.left - colLeft) > 1) bad.push(`left=${Math.round(head.left)}!=${Math.round(colLeft)}`);
    const ir = intro.getBoundingClientRect();
    if (ir.left < colLeft - 1 || ir.right > colRight + 1) bad.push(`outside-column=${Math.round(ir.left)}..${Math.round(ir.right)}`);
    if (d.documentElement.scrollWidth > w) bad.push(`h-scroll=${d.documentElement.scrollWidth}`);
    return [!bad.length, `${w}x${h} ${bad.join(' ') || 'ok'}`];
  },

  // Мастерская: блок как на jkim.ru — фото 2:3 от левого края (на компьютере
  // половина ширины, текст справа; на телефоне во всю ширину, текст под ним),
  // кнопка «Записаться на визит» во всю ширину колонки ведёт в Telegram.
  async 'studio-visit'() {
    const w = +q.get('w');
    const h = +q.get('h');
    const win = await load('../studio.html', w, h);
    const d = win.document;
    const bad = [];
    const img = d.querySelector('.studio-visit .visit-photo img');
    const text = d.querySelector('.studio-visit .visit-text');
    const btn = d.querySelector('.studio-visit a.visit-book');
    if (!img || !text || !btn) return [false, `${w}x${h} missing-blocks`];
    if (!img.complete) await new Promise((r) => { img.onload = img.onerror = r; setTimeout(r, 5000); });
    if (!img.naturalWidth) bad.push('img-not-loaded');
    const cw = d.documentElement.clientWidth;
    const ir = img.getBoundingClientRect();
    const tr = text.getBoundingClientRect();
    const br = btn.getBoundingClientRect();
    const ratio = ir.width / ir.height;
    if (Math.abs(ratio - 2 / 3) > 0.03) bad.push(`img-ratio=${ratio.toFixed(2)}`);
    if (Math.abs(ir.left) > 1) bad.push(`img-left=${Math.round(ir.left)}`);
    if (w >= 740) {
      if (Math.abs(ir.width - cw / 2) > 2) bad.push(`img-w=${Math.round(ir.width)}`);
      if (tr.left < cw / 2 - 1) bad.push('text-not-right');
      if (Math.abs(tr.top - ir.top) > 2) bad.push('text-not-beside');
    } else {
      if (Math.abs(ir.width - cw) > 1) bad.push(`img-w=${Math.round(ir.width)}`);
      if (tr.top < ir.bottom - 1) bad.push('text-not-below');
    }
    const ts = win.getComputedStyle(text);
    const inner = tr.width - parseFloat(ts.paddingLeft) - parseFloat(ts.paddingRight);
    if (Math.abs(br.width - inner) > 2) bad.push(`btn-w=${Math.round(br.width)}/${Math.round(inner)}`);
    if (parseFloat(win.getComputedStyle(btn).borderTopWidth) < 1) bad.push('btn-no-border');
    if (btn.getAttribute('href') !== 'https://t.me/alinakhoniakart' || btn.target !== '_blank') bad.push('btn-link');
    if (d.documentElement.scrollWidth > w) bad.push(`h-scroll=${d.documentElement.scrollWidth}`);
    return [!bad.length, `${w}x${h} ${bad.join(' ') || 'ok'}`];
  },

  // «Об авторе»: портрет 3:4 и рядом (на телефоне — под ним) Artist statement,
  // ниже полное CV по vigbo — 6 разделов, у публикаций ссылки на статьи;
  // внизу ссылки на подразделы без CV и Statement (они уже на странице).
  async 'about-page'() {
    const w = +q.get('w');
    const h = +q.get('h');
    const win = await load('../about.html', w, h);
    const d = win.document;
    const bad = [];
    const img = d.querySelector('.about-portrait img');
    const statement = d.querySelector('.about-statement');
    if (!img || !statement) return [false, `${w}x${h} missing-blocks`];
    if (!img.complete) await new Promise((r) => { img.onload = img.onerror = r; setTimeout(r, 5000); });
    if (!img.naturalWidth || Math.abs(img.naturalWidth / img.naturalHeight - 0.75) > 0.01) bad.push(`portrait=${img.naturalWidth}x${img.naturalHeight}`);
    if (d.querySelector('.about-portrait figcaption')) bad.push('portrait-caption'); // подпись фотографа убрана
    // по-русски — «Биография» и «Описание творчества», CV и Artist statement только в EN (about-en)
    const stTitle = statement.querySelector('h2')?.textContent.trim();
    if (stTitle !== 'Описание творчества') bad.push(`statement-title=${stTitle}`);
    const cvTitle = d.querySelector('.about-cv-title')?.textContent.trim();
    if (cvTitle !== 'Биография') bad.push(`cv-title=${cvTitle}`);
    const paras = statement.querySelectorAll('.prose p').length;
    if (paras !== 3) bad.push(`statement-paras=${paras}`);
    const heads = [...d.querySelectorAll('.about-cv .cv-section h2')].map((x) => x.textContent.trim());
    const wantHeads = ['Образование', 'Педагогическая деятельность', 'Выставки', 'Кураторские проекты', 'Награды', 'Публикации'];
    if (heads.join('|') !== wantHeads.join('|')) bad.push(`cv-heads=${heads.join('|')}`);
    const counts = [...d.querySelectorAll('.about-cv .cv-section')].map((x) => x.querySelectorAll('.cv-row').length);
    if (counts.join() !== '2,3,22,1,5,9') bad.push(`cv-rows=${counts}`);
    const links = [...d.querySelectorAll('.about-cv a[href^="http"]')];
    if (links.length !== 7 || links.some((a) => a.target !== '_blank')) bad.push(`pub-links=${links.length}`);
    // подразделы удалены — их списки уже в CV выше
    const sub = [...d.querySelectorAll('.about-links, a[href$="teaching.html"], a[href$="curatorial.html"], a[href$="publications.html"]')];
    if (sub.length) bad.push(`sub-links=${sub.length}`);
    const ir = img.getBoundingClientRect();
    const sr = statement.getBoundingClientRect();
    if (w > 900 && sr.left < ir.right) bad.push('statement-not-beside');
    if (w <= 900 && sr.top < ir.bottom) bad.push('statement-not-below');
    if (d.documentElement.scrollWidth > w) bad.push(`h-scroll=${d.documentElement.scrollWidth}`);
    return [!bad.length, `${w}x${h} ${bad.join(' ') || 'ok'}`];
  },

  // EN «Об авторе»: заголовки остаются CV и Artist statement.
  async 'about-en'() {
    const d = (await load('../about.html?lang=en')).document;
    const st = d.querySelector('.about-statement h2')?.textContent.trim();
    const cv = d.querySelector('.about-cv-title')?.textContent.trim();
    const ok = st === 'Artist statement' && cv === 'CV';
    return [ok, ok ? 'ok' : `statement="${st}" cv="${cv}"`];
  },

  // Мастерская, фото процесса: без текста-заглушки, ровно два фото и никаких
  // пустых ячеек — на компьютере в один ряд одной высоты во всю ширину,
  // на телефоне одно под другим во всю ширину.
  async 'studio-photos'() {
    const w = +q.get('w');
    const h = +q.get('h');
    const win = await load('../studio.html', w, h);
    const d = win.document;
    const bad = [];
    const wrap = d.querySelector('.studio-photos');
    if (!wrap) return [false, `${w}x${h} no-photos`];
    if (d.querySelector('#studio .prose p')) bad.push('placeholder-text');
    const items = [...wrap.children];
    const zoom = items.map((b) => b.dataset.zoom).join();
    if (zoom !== 'assets/photos/studio-1-full.jpg,assets/photos/studio-2-full.jpg') bad.push(`items=${zoom}`);
    wrap.scrollIntoView({ block: 'start', behavior: 'instant' }); // фото грузятся лениво
    const imgs = items.map((b) => b.querySelector('img'));
    await Promise.all(imgs.map((img) => (img.complete ? null
      : new Promise((r) => { img.addEventListener('load', r); img.addEventListener('error', r); setTimeout(r, 5000); }))));
    await wait(200);
    if (imgs.some((img) => !img || !img.naturalWidth)) bad.push('img-not-loaded');
    const box = wrap.getBoundingClientRect();
    const r = imgs.map((img) => img.getBoundingClientRect());
    if (r.length === 2) {
      if (w >= 740) {
        if (Math.abs(r[0].top - r[1].top) > 1 || Math.abs(r[0].height - r[1].height) > 2) bad.push(`not-one-row=${Math.round(r[0].height)}/${Math.round(r[1].height)}`);
        if (Math.abs(r[1].right - box.right) > 2 || Math.abs(r[0].left - box.left) > 2) bad.push('row-not-full-width');
      } else {
        if (r[1].top < r[0].bottom) bad.push('not-stacked');
        if (r.some((x) => Math.abs(x.width - box.width) > 2)) bad.push('not-full-width');
      }
    }
    return [!bad.length, `${w}x${h} ${bad.join(' ') || 'ok'}`];
  },

  // Подвал: под «© год Алина Хоняк» — круглые ссылки Telegram, VK, Pinterest (Instagram нет)
  // со значками (без надписей, с aria-label), под ними — про авторское право.
  async 'footer'() {
    const w = +q.get('w');
    const win = await load('../contacts.html', w, 800);
    const d = win.document;
    const bad = [];
    const copy = d.querySelector('.site-footer .footer-copy');
    const icons = [...d.querySelectorAll('.site-footer .footer-social a.social-icon')];
    const rights = d.querySelector('.site-footer .footer-rights');
    if (!copy || !/©\s*\d{4}/.test(copy.textContent)) bad.push('no-copyright');
    const want = ['https://t.me/alinakhoniak', 'https://vk.ru/alinakhoniakchannel', 'https://pin.it/5FzbwuKWl'];
    if (icons.map((a) => a.getAttribute('href')).join() !== want.join()) bad.push(`hrefs=${icons.map((a) => a.getAttribute('href'))}`);
    icons.forEach((a, i) => {
      const r = a.getBoundingClientRect();
      const cs = win.getComputedStyle(a);
      if (!a.getAttribute('aria-label')) bad.push(`${i}:no-label`);
      if (!a.querySelector('svg')) bad.push(`${i}:no-svg`);
      if (a.textContent.trim()) bad.push(`${i}:text`);
      if (Math.abs(r.width - r.height) > 1 || r.width < 32) bad.push(`${i}:size=${Math.round(r.width)}x${Math.round(r.height)}`);
      if (parseFloat(cs.borderTopLeftRadius) < r.width / 2 - 1 && cs.borderTopLeftRadius !== '50%') bad.push(`${i}:not-round`);
      if (a.target !== '_blank') bad.push(`${i}:target`);
      // без адреса сайта-отправителя: иначе pin.it отдаёт картинку 1×1 вместо профиля (чёрный экран)
      if (!a.relList.contains('noreferrer')) bad.push(`${i}:sends-referrer`);
      if (copy && r.top < copy.getBoundingClientRect().bottom) bad.push(`${i}:not-below-copy`);
    });
    if (!rights || !rights.textContent.trim()) bad.push('no-rights');
    else if (icons[0] && rights.getBoundingClientRect().top < icons[0].getBoundingClientRect().bottom) bad.push('rights-not-below');
    return [!bad.length, `${w} ${bad.join(' ') || 'ok'}`];
  },

  // Закрытое меню не перекрывает страницу: слой скрыт, а точка в центре
  // заголовка на «Инфо» попадает в сам заголовок, а не в невидимое меню.
  // То же после открытия и закрытия меню.
  async 'menu-closed'() {
    const bad = [];
    const win = await load('../info.html', 1280, 800);
    const d = win.document;
    const hit = (tag) => {
      const s = d.querySelector('details.info-item summary');
      const r = s.getBoundingClientRect();
      const el = d.elementFromPoint(r.left + 20, r.top + r.height / 2);
      if (!s.contains(el)) bad.push(`${tag}:hit=${el ? el.className || el.tagName : 'none'}`);
    };
    const layer = d.querySelector('.menu-layer');
    if (win.getComputedStyle(layer).display !== 'none') bad.push('layer-shown');
    hit('initial');
    d.querySelector('.menu-toggle').click();
    await wait(600);
    d.querySelector('.menu-toggle').click();
    await wait(800);
    if (win.getComputedStyle(layer).display !== 'none') bad.push('layer-shown-after-close');
    hit('after-close');
    return [!bad.length, bad.join(' ') || 'ok'];
  },

  // «Инфо»: пять документов раскрывающимся списком — сначала всё свёрнуто,
  // клик по заголовку открывает и закрывает; адрес с #id открывает нужный
  // пункт и прокручивает к нему; ссылка [..](#privacy) внутри открывает политику.
  async 'info-accordion'() {
    const bad = [];
    let win = await load('../info.html', 1280, 800);
    let d = win.document;
    const ids = [...d.querySelectorAll('details.info-item')].map((x) => x.id);
    if (ids.join() !== 'delivery,returns,privacy,consent,offer') bad.push(`ids=${ids}`);
    if (d.querySelector('details.info-item[open]')) bad.push('open-by-default');
    const tg = d.querySelector('#delivery a[href="https://t.me/alinakhoniakart"]');
    if (!tg || tg.textContent !== '@alinakhoniakart' || tg.target !== '_blank') bad.push('no-telegram-link');
    const first = d.querySelector('details.info-item');
    const summary = first && first.querySelector('summary');
    if (!summary || !summary.textContent.trim()) bad.push('no-summary');
    else {
      summary.click();
      if (!first.open) bad.push('click-no-open');
      summary.click();
      if (first.open) bad.push('click-no-close');
    }

    // другой query — иначе смена одного #хэша не перезагружает фрейм
    win = await load('../info.html?from=link#consent', 1280, 800);
    d = win.document;
    const consent = d.getElementById('consent');
    const open = [...d.querySelectorAll('details.info-item[open]')].map((x) => x.id);
    if (open.join() !== 'consent') bad.push(`hash-open=${open}`);
    if (consent) {
      const top = consent.getBoundingClientRect().top;
      const header = d.querySelector('.site-header').getBoundingClientRect().bottom;
      if (top < header - 1 || top > 800 / 2) bad.push(`hash-scroll-top=${Math.round(top)}`);
      const link = consent.querySelector('a[href="#privacy"]');
      if (!link) bad.push('no-privacy-link');
      else {
        link.click();
        await wait(300);
        if (!d.getElementById('privacy').open) bad.push('privacy-link-no-open');
      }
    }
    return [!bad.length, bad.join(' ') || 'ok'];
  },

  // «Инфо» на английском: доставка и возврат — по-английски, а политика,
  // согласие и оферта — русский текст с пометкой «только на русском».
  async 'info-en'() {
    const bad = [];
    const win = await load('../info.html?lang=en', 1280, 800);
    const d = win.document;
    const note = (id) => !!d.querySelector(`#${id} .info-note`);
    ['delivery', 'returns'].forEach((id) => {
      if (note(id)) bad.push(`${id}:note`);
      if (/[а-яё]/i.test(d.querySelector(`#${id} .info-body`)?.textContent || 'я')) bad.push(`${id}:cyrillic`);
    });
    ['privacy', 'consent', 'offer'].forEach((id) => {
      if (!note(id)) bad.push(`${id}:no-note`);
      if (d.querySelector(`#${id} .info-body`)?.lang !== 'ru') bad.push(`${id}:no-lang-ru`);
    });
    return [!bad.length, bad.join(' ') || 'ok'];
  },

  // Старые адреса серий через project.html ведут на страницу серии.
  async 'old-series-slug'() {
    const bad = [];
    for (const [from, to] of [['project.html?slug=city', 'series.html#city'],
      ['series-view.html?slug=mountains-and-sea', 'series.html#mountains-and-sea']]) {
      const win = await load(`../${from}`);
      const path = win.location.pathname + win.location.search + win.location.hash;
      if (!path.endsWith(to)) bad.push(`${from}->${path}`);
    }
    return [!bad.length, bad.join(' ') || 'ok'];
  },

  // Серии: ленты друг под другом — «Горы и море» (17), «Город» (4, без фото в раме)
  // и четыре серии без описаний (подписей под ними нет); у «Гор и моря» и «Города»
  // под каждой картиной подпись; стрелки листают ленту, клик открывает просмотрщик.
  async 'series-strips'() {
    const w = +q.get('w');
    const h = +q.get('h');
    const win = await load('../series.html', w, h);
    const d = win.document;
    const bad = [];
    const strips = [...d.querySelectorAll('.strip')];
    const ids = strips.map((s) => s.id).join();
    if (ids !== 'mountains-and-sea,city,portraits,chuvash-land,maintenance-day,portraits-graphics') bad.push(`ids=${ids}`);
    const heads = strips.map((s) => s.querySelector('h2')?.textContent.trim()).join('|');
    if (heads !== 'Горы и море|Город|Портреты|Чувашский край|День профилактики|Портреты. Графика') bad.push(`heads=${heads}`);
    const counts = strips.map((s) => s.querySelectorAll('.strip-item').length).join();
    if (counts !== '17,4,9,6,5,14') bad.push(`counts=${counts}`);
    if (d.querySelector('[data-zoom$="chuvash-land-05-1-full.jpg"]')) bad.push('framed-5.1');
    const pp = [...(strips[2]?.querySelectorAll('[data-zoom]') || [])].map((b) => b.dataset.zoom.match(/portrait-painting-(\d+)/)?.[1]).join();
    if (pp !== '01,02,03,04,05,07,08,09,06') bad.push(`portrait-painting-order=${pp}`);
    const capCounts = strips.map((s) => s.querySelectorAll('.strip-item figcaption').length).join();
    if (capCounts !== '17,4,0,0,0,0') bad.push(`captions=${capCounts}`);
    const noAlt = [...d.querySelectorAll('.strip-item img')].filter((img) => !img.alt || /^\d+$/.test(img.alt)).length;
    if (noAlt) bad.push(`bad-alts=${noAlt}`);
    const caps = strips.map((s) => [...s.querySelectorAll('.strip-item figcaption')].map((c) => c.textContent.replace(/\s+/g, ' ').trim()));
    if (caps[0]?.[0] !== '«Кипарисы» 63 × 70 см · холст, масло · 2019') bad.push(`cap0=${caps[0]?.[0]}`);
    const city = (caps[1] || []).map((c) => c.split('»')[0] + '»').join('|');
    if (city !== '«Дом на 11 линии. Кристалл»|«Весна в Петербурге»|«Петербургские крыши»|«Английская набережная»') bad.push(`city=${city}`);
    const track = strips[0]?.querySelector('.strip-track');
    const imgs = [...(track?.querySelectorAll('img') || [])].slice(0, 2);
    await Promise.all(imgs.map((img) => img.complete ? 0 : new Promise((r) => { img.onload = img.onerror = r; setTimeout(r, 5000); })));
    if (imgs.some((img) => !img.naturalWidth)) bad.push('img-not-loaded');
    const hs = [...(track?.querySelectorAll('img') || [])].map((img) => Math.round(img.getBoundingClientRect().height));
    if (new Set(hs).size !== 1 || !hs[0]) bad.push(`heights=${[...new Set(hs)]}`);
    if (track && track.scrollWidth <= track.clientWidth) bad.push('no-overflow');
    const prev = strips[0]?.querySelector('.strip-nav [data-dir="-1"]');
    const next = strips[0]?.querySelector('.strip-nav [data-dir="1"]');
    if (!prev?.disabled) bad.push('prev-enabled-at-start');
    // плавную прокрутку фоновый браузер не анимирует — проверяем запрос сдвига и стрелки у краёв
    const asks = [];
    if (track) track.scrollBy = (o) => asks.push(o.left);
    next?.click();
    if (!(asks[0] > track.clientWidth / 2)) bad.push(`next-asks=${asks}`);
    track.scrollLeft = track.scrollWidth;
    track.dispatchEvent(new win.Event('scroll'));
    if (prev?.disabled || !next?.disabled) bad.push(`at-end prev=${prev?.disabled} next=${next?.disabled}`);
    const zoom = strips[1]?.querySelector('.strip-item [data-zoom]');
    if (zoom?.dataset.gallery !== 'city') bad.push(`gallery=${zoom?.dataset.gallery}`);
    zoom?.click();
    await wait(300);
    if (!d.querySelector('.viewer.is-open, .viewer[open], .viewer:not([hidden])')) bad.push('viewer-closed');
    if (d.documentElement.scrollWidth > w) bad.push(`h-scroll=${d.documentElement.scrollWidth}`);
    return [!bad.length, `${w}x${h} ${bad.join(' ') || 'ok'}`];
  },

  // Просмотрщик: у картины серии подпись сразу под изображением, на телефоне —
  // поля слева и справа; при приближении подпись прячется; без подписи в ленте — без подписи.
  async 'viewer-caption'() {
    const w = +q.get('w');
    const h = +q.get('h');
    const win = await load('../series.html', w, h);
    const d = win.document;
    const bad = [];
    const loaded = async (img) => { if (!img.complete || !img.naturalWidth) await new Promise((r) => { img.onload = img.onerror = r; setTimeout(r, 5000); }); await wait(100); };
    d.querySelector('.strip-item [data-zoom]').click();
    const img = d.querySelector('.viewer-img');
    const cap = d.querySelector('.viewer-caption');
    await loaded(img);
    const text = () => cap?.textContent.replace(/\s+/g, ' ').trim();
    if (text() !== '«Кипарисы» 63 × 70 см · холст, масло · 2019') bad.push(`cap=${text()}`);
    const ir = img.getBoundingClientRect();
    const cr = cap?.getBoundingClientRect();
    if (!cr || cap.hidden || cr.height === 0) bad.push('cap-hidden');
    else {
      if (cr.top < ir.bottom - 1 || cr.top - ir.bottom > 40) bad.push(`cap-gap=${Math.round(cr.top - ir.bottom)}`);
      if (cr.bottom > h) bad.push(`cap-offscreen=${Math.round(cr.bottom)}`);
    }
    if (ir.left < 12 || ir.right > w - 12) bad.push(`edges=${Math.round(ir.left)},${Math.round(w - ir.right)}`);
    d.querySelector('.viewer-next').click();
    await loaded(img);
    if (!text()?.startsWith('«Фиолент»')) bad.push(`next-cap=${text()}`);
    img.dispatchEvent(new win.MouseEvent('dblclick', { bubbles: true, clientX: w / 2, clientY: h / 2 }));
    await wait(100);
    if (!cap || win.getComputedStyle(cap).visibility !== 'hidden') bad.push('cap-visible-zoomed');
    // главная: у фото нет подписи — и в просмотрщике её нет
    const home = (await load('../index.html', w, h)).document;
    home.querySelector('[data-zoom]').click();
    await wait(300);
    const hc = home.querySelector('.viewer-caption');
    if (hc && !hc.hidden) bad.push('home-cap-shown');
    return [!bad.length, `${w}x${h} ${bad.join(' ') || 'ok'}`];
  },

  // Смена языка при открытом меню: страница перезагружается с ?lang=, меню
  // остаётся открытым (а не «возвращает» на страницу под ним) и уже на новом языке;
  // при следующей обычной загрузке меню закрыто.
  async 'menu-lang'() {
    const bad = [];
    let win = await load('../series.html', 1440, 900);
    win.document.querySelector('.menu-toggle').click();
    await wait(600);
    const reloaded = new Promise((r) => { frame.onload = () => setTimeout(r, 1500); });
    win.document.querySelector('.lang-switch [data-lang="en"]').click();
    await reloaded;
    win = frame.contentWindow;
    const d = win.document;
    if (!/series\.html\?lang=en$/.test(win.location.href)) bad.push(`url=${win.location.pathname}${win.location.search}`);
    if (d.documentElement.lang !== 'en') bad.push(`lang=${d.documentElement.lang}`);
    if (!d.body.classList.contains('menu-open') || d.querySelector('#site-menu').hidden) bad.push('menu-closed');
    const label = d.querySelector('.menu-toggle').getAttribute('aria-label');
    if (label !== 'Close') bad.push(`toggle-label=${label}`);
    const first = d.querySelector('.menu-title')?.textContent;
    if (first !== 'Alina Khoniak') bad.push(`menu-title=${first}`);
    const again = new Promise((r) => { frame.onload = () => setTimeout(r, 1500); });
    win.location.reload();
    await again;
    if (frame.contentWindow.document.body.classList.contains('menu-open')) bad.push('menu-open-after-plain-reload');
    try { frame.contentWindow.localStorage.setItem('akh-lang', 'ru'); } catch (_) { /* ignore */ }
    return [!bad.length, bad.join(' ') || 'ok'];
  },

  // EN: подписи и названия серий по-английски.
  async 'series-en'() {
    const d = (await load('../series.html?lang=en')).document;
    const heads = [...d.querySelectorAll('.strip h2')].map((x) => x.textContent.trim()).join('|');
    const cap = d.querySelector('.strip-item figcaption')?.textContent.replace(/\s+/g, ' ').trim();
    const ok = heads === 'Mountains and Sea|City|Portraits|Chuvash Land|Maintenance Day|Portraits. Graphics'
      && cap === '“Cypresses” 63 × 70 cm · oil on canvas · 2019';
    return [ok, ok ? 'ok' : `heads=${heads} cap=${cap}`];
  },

  // EN: заголовок вкладки и подпись меню для экранных дикторов — по-английски.
  async 'en-titles'() {
    const bad = [];
    for (const [page, title] of [['about', 'About — Alina Khoniak'], ['index', 'Alina Khoniak — painter']]) {
      const d = (await load(`../${page}.html?lang=en`)).document;
      if (d.title !== title) bad.push(`${page}:title="${d.title}"`);
      const label = d.querySelector('.menu-grid')?.getAttribute('aria-label');
      if (label !== 'Menu') bad.push(`${page}:menu-label="${label}"`);
    }
    return [!bad.length, bad.join(' ') || 'ok'];
  },

  // Проект: canonical, hreflang и og:url — с его slug, а не общий адрес страницы.
  async 'detail-canonical'() {
    const d = (await load('../project.html?slug=chuvash-wedding')).document;
    const urls = [
      ...[...d.querySelectorAll('link[rel="canonical"], link[rel="alternate"][hreflang]')].map((l) => l.href),
      d.querySelector('meta[property="og:url"]')?.content,
    ];
    const bad = urls.filter((u) => !String(u).includes('slug=chuvash-wedding'));
    return [urls.length === 5 && !bad.length, bad.join(' ') || `ok (${urls.length})`];
  },

  // Главная: вверху Алина у «Чувашской свадьбы», ниже два фрагмента картины
  // в два столбца; подписи (alt) — по смыслу, а не «1», «2»…
  async 'home-alts'() {
    const d = (await load('../index.html', 1440, 900)).document;
    const bad = [];
    const hero = d.querySelector('#home .hero-figure img');
    if (!hero?.getAttribute('src').endsWith('home-hero.jpg')) bad.push(`hero=${hero?.getAttribute('src')}`);
    if (!hero?.alt.includes('Чувашская свадьба')) bad.push(`hero-alt=${hero?.alt}`);
    const photos = [...d.querySelectorAll('#home .photo-grid img')];
    const srcs = photos.map((img) => img.getAttribute('src').replace('assets/works/', '')).join();
    if (srcs !== 'chuvash-wedding-08-thumb.jpg,chuvash-wedding-09-thumb.jpg') bad.push(`photos=${srcs}`);
    if (photos.some((img) => !img.alt || /^\d+$/.test(img.alt))) bad.push('photo-alts');
    const tops = photos.map((img) => Math.round(img.getBoundingClientRect().top));
    if (new Set(tops).size !== 1) bad.push(`not-one-row=${tops}`);
    const wid = photos.map((img) => img.getBoundingClientRect().width);
    if (wid.some((x) => x < 500)) bad.push(`narrow=${wid.map(Math.round)}`);
    return [!bad.length, bad.join(' ') || 'ok'];
  },

  // Проекты: две карточки; на странице проекта главная картинка вверху,
  // ниже текст и остальные фото; подписи фотографа нет.
  async 'projects'() {
    const w = +q.get('w');
    const h = +q.get('h');
    const bad = [];
    const list = (await load('../projects.html', w, h)).document;
    const cards = [...list.querySelectorAll('.card')];
    const titles = cards.map((c) => c.querySelector('.card-title')?.textContent.trim()).join('|');
    if (titles !== 'Чувашская свадьба|Садовые кварталы') bad.push(`cards=${titles}`);
    // проекты друг под другом на любой ширине; обложка не выше экрана
    const cr = cards.map((c) => c.getBoundingClientRect());
    if (cr[1] && cr[1].top < cr[0].bottom) bad.push('cards-not-stacked');
    const cover = cards[0]?.querySelector('.card-cover')?.getBoundingClientRect();
    if (cover && cover.height > h) bad.push(`cover-h=${Math.round(cover.height)}`);
    const ttl = cards[0]?.querySelector('.card-title')?.getBoundingClientRect();
    if (cover && ttl && ttl.left > cover.left && ttl.left - cover.right < 20) bad.push(`title-gap=${Math.round(ttl.left - cover.right)}`);
    const want = {
      'chuvash-wedding': { hero: 'chuvash-wedding-09-full.jpg', text: '«Мои предки самыми важными событиями', end: 'родственников».', paras: 3, photos: 12 },
      'sadovye-kvartaly': { hero: 'sadovye-kvartaly-04-full.jpg', text: 'Роспись стены в интерьере квартиры', end: 'этому ритму.', paras: 1, photos: 12 },
    };
    for (const [slug, x] of Object.entries(want)) {
      const d = (await load(`../project.html?slug=${slug}`, w, h)).document;
      const hero = d.querySelector('.project-hero [data-zoom]');
      if (!hero?.dataset.zoom.endsWith(x.hero)) bad.push(`${slug}:hero=${hero?.dataset.zoom}`);
      const heroImg = hero?.querySelector('img');
      const title = d.querySelector('h1');
      if (heroImg && title && heroImg.getBoundingClientRect().top < title.getBoundingClientRect().bottom) bad.push(`${slug}:hero-above-title`);
      const paras = [...d.querySelectorAll('.project-text p')];
      if (paras.length !== x.paras || !paras[0]?.textContent.startsWith(x.text)) bad.push(`${slug}:text=${paras.length}:${paras[0]?.textContent.slice(0, 30)}`);
      if (!paras.at(-1)?.textContent.endsWith(x.end)) bad.push(`${slug}:text-end=${paras.at(-1)?.textContent.slice(-20)}`);
      if (heroImg && paras[0] && paras[0].getBoundingClientRect().top < heroImg.getBoundingClientRect().bottom) bad.push(`${slug}:text-above-hero`);
      const grid = [...d.querySelectorAll('.photo-grid [data-zoom]')];
      if (grid.length !== x.photos) bad.push(`${slug}:photos=${grid.length}`);
      if (grid.some((b) => b.dataset.zoom === hero?.dataset.zoom)) bad.push(`${slug}:hero-twice`);
      if (grid.some((b) => b.dataset.zoom.endsWith('chuvash-wedding-02-full.jpg'))) bad.push(`${slug}:photo-2`);
      // без больших промежутков: в каждой колонке фото идут вплотную (через обычный отступ)
      const imgs = grid.map((b) => b.querySelector('img'));
      imgs.forEach((img) => { img.loading = 'eager'; });
      await Promise.all(imgs.map((img) => img.complete ? 0 : new Promise((r) => { img.onload = img.onerror = r; setTimeout(r, 6000); })));
      await wait(200);
      const cols = new Map();
      grid.forEach((b) => {
        const r = b.getBoundingClientRect();
        const key = Math.round(r.left);
        cols.set(key, [...(cols.get(key) || []), r]);
      });
      let worst = 0;
      cols.forEach((rs) => {
        rs.sort((a, b2) => a.top - b2.top);
        for (let i = 1; i < rs.length; i += 1) worst = Math.max(worst, rs[i].top - rs[i - 1].bottom);
      });
      if (worst > 40) bad.push(`${slug}:gap=${Math.round(worst)}`);
      if (/Жигалов|Фото:/.test(d.body.textContent)) bad.push(`${slug}:photo-credit`);
      if (d.documentElement.scrollWidth > w) bad.push(`${slug}:h-scroll`);
    }
    const en = (await load('../project.html?slug=sadovye-kvartaly&lang=en', w, h)).document;
    if (!en.querySelector('.project-text p')?.textContent.startsWith('A wall painting')) bad.push('en-text');
    const enCw = (await load('../project.html?slug=chuvash-wedding&lang=en', w, h)).document;
    const enP = [...enCw.querySelectorAll('.project-text p')].map((p) => p.textContent);
    if (!enP[0]?.startsWith('“My ancestors') || !enP.at(-1)?.endsWith('relatives.”')) bad.push('en-quote');
    if (/Zhigalov|Photos:/.test(en.body.textContent)) bad.push('en-photo-credit');
    return [!bad.length, `${w}x${h} ${bad.join(' ') || 'ok'}`];
  },
};

(async () => {
  const name = q.get('case');
  try {
    const [ok, msg] = await cases[name]();
    done(ok, `${name}: ${msg}`);
  } catch (err) {
    done(false, `${name}: ${err}`);
  }
})();
</script>
</body>
</html>
