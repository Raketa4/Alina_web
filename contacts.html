  <link rel="alternate" hreflang="en" href="https://raketa4.github.io/Alina_web/contacts.html?lang=en">
  <link rel="alternate" hreflang="x-default" href="https://raketa4.github.io/Alina_web/contacts.html">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Контакты — Алина Хоняк">
  <meta property="og:description" content="Связаться с художником Алиной Хоняк: приобретение работ, заказы, выставочные и кураторские проекты, коллаборации с брендами.">
  <meta property="og:image" content="https://raketa4.github.io/Alina_web/assets/og-image.png">
  <meta property="og:url" content="https://raketa4.github.io/Alina_web/contacts.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <main id="main">
    <div class="container page-head">
      <p class="eyebrow" data-i18n="nav.contacts">Контакты</p>
      <h1 data-i18n="contacts.title">Контакты</h1>
      <p class="lead" data-i18n="contacts.lead">Приобретение работ, заказы, выставочные и кураторские проекты, коллаборации с брендами.</p>
    </div>
    <hr class="rule">
    <section class="section container">
      <div class="contact-columns">
        <form class="form" id="contact-form" novalidate>
          <div class="field">
            <label for="cf-name" data-i18n="contacts.formName">Имя</label>
            <input id="cf-name" name="name" type="text" autocomplete="name" data-i18n-attr="placeholder:contacts.namePlaceholder">
          </div>
          <div class="field">
            <label for="cf-contact" data-i18n="contacts.formContact">E-mail или Telegram</label>
            <input id="cf-contact" name="contact" type="text" data-i18n-attr="placeholder:contacts.contactPlaceholder">
          </div>
          <div class="field">
            <label for="cf-message" data-i18n="contacts.formMessage">Сообщение</label>
            <textarea id="cf-message" name="message" data-i18n-attr="placeholder:contacts.messagePlaceholder"></textarea>
          </div>
          <div><button class="btn btn--accent" type="submit" data-i18n="contacts.formSend">Написать</button></div>
        </form>
        <div class="contact-direct" id="contact-direct"></div>
      </div>
    </section>
  </main>


  <script type="module">
    import { bootPage } from './js/page.js';
    import { initContacts } from './js/contacts.js';
    bootPage(initContacts);
  </script>

</body>
</html>
